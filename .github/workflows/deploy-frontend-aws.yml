name: Deploy Frontend to AWS

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Build portfolio (static export)
        working-directory: portfolio
        run: |
          npm ci
          npm run build

      # Publish only the static export, never repository internals.
      # Hashed Next.js assets are immutable. Everything else revalidates in the browser
      # on every visit but stays cached at CloudFront edges for a day (s-maxage); the
      # invalidation below clears the edges on each deploy, so visitors never see a stale page.
      # --delete removes files the build no longer produces, so a stray upload cannot
      # stay public; the _next/ exclude also keeps it from deleting hashed assets.
      - name: Publish portfolio to S3
        run: |
          aws s3 sync portfolio/out/_next s3://${{ vars.AWS_S3_BUCKET }}/_next \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync portfolio/out/ s3://${{ vars.AWS_S3_BUCKET }}/ --exclude "_next/*" --delete \
            --cache-control "public, max-age=0, s-maxage=86400, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

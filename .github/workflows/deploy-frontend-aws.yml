name: Deploy Frontend to AWS

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Build portfolio (static export)
        working-directory: portfolio
        run: |
          npm ci
          npm run build

      # Publish only the static export, never repository internals.
      # Hashed Next.js assets are immutable. Everything else revalidates in the browser
      # on every visit but stays cached at CloudFront edges for a day (s-maxage); the
      # invalidation below clears the edges on each deploy, so visitors never see a stale page.
      # --delete removes files the build no longer produces, so a stray upload cannot
      # stay public; the _next/ exclude also keeps it from deleting hashed assets.
      - name: Publish portfolio to S3
        run: |
          aws s3 sync portfolio/out/_next s3://${{ vars.AWS_S3_BUCKET }}/_next \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync portfolio/out/ s3://${{ vars.AWS_S3_BUCKET }}/ --exclude "_next/*" --delete \
            --cache-control "public, max-age=0, s-maxage=86400, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      # Draws a deploy marker on the obs.atla.in Grafana dashboard. Optional: skipped
      # when the token is not configured, and a Grafana outage never fails the deploy.
      - name: Mark deploy in Grafana
        continue-on-error: true
        env:
          GRAFANA_URL: ${{ vars.GRAFANA_URL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_ANNOTATIONS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$GRAFANA_URL" ] || [ -z "$GRAFANA_TOKEN" ]; then
            echo "Grafana not configured; skipping deploy marker."
            exit 0
          fi
          TEXT="atla.in deployed ${GITHUB_SHA::7}: $(git log -1 --format=%s) (<a href=\"$RUN_URL\">run</a>)"
          jq -n --arg text "$TEXT" '{tags: ["atla.in", "deploy"], text: $text}' \
            | curl -fsS -X POST "$GRAFANA_URL/api/annotations" \
                -H "Authorization: Bearer $GRAFANA_TOKEN" \
                -H "Content-Type: application/json" \
                --data @-
